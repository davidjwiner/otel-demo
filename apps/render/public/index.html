<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Filled in by the server with its current span, so the browser's
         page-load span joins the server's GET / trace. -->
    <meta name="traceparent" content="{{traceparent}}" />
    <title>otel-demo · Render</title>
  </head>
  <body style="font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; line-height: 1.5">
    <h1>otel-demo · Render</h1>
    <p>
      Click the button to place an order. The browser starts a trace, the API continues it, the
      background worker picks the trace up from the job row, and the browser polls the order
      status, all in one trace.
    </p>
    <button style="font-size: 16px; padding: 8px 16px">Place order</button>
    <p id="trace"></p>
    <ul id="log"></ul>
    <script type="module" src="/app.js"></script>
  </body>
</html>
